[package]
name = "minmark-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Renderer de Preview de minmark: AST → página HTML (ISSUE-016)"

[dependencies]
minmark-document = { workspace = true }
minmark-config = { workspace = true }
minmark-math = { workspace = true }
minmark-diagram = { workspace = true }
usvg = { version = "0.43", features = ["text", "fontdb"] }
fontdb = "0.21"
hayagriva = { version = "0.10.1", default-features = false, features = ["biblatex"] }
typst = { workspace = true }
typst-assets = { workspace = true }
typst-svg = "0.13"

[dev-dependencies]
minmark-parser = { path = "../minmark-parser" }

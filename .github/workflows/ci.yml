name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/test_release.py

  test:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Identify toolchain
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('core/Cargo.lock', 'ui/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - name: Test complete core on Linux
        if: runner.os == 'Linux'
        run: cargo test --locked --release --manifest-path core/Cargo.toml --workspace
      - name: Test portable core on Windows and macOS
        if: runner.os != 'Linux'
        # minmark-fs still uses Unix symlinks and Linux-specific filesystem APIs.
        run: cargo test --locked --release --manifest-path core/Cargo.toml --workspace --exclude minmark-fs
      - name: Test desktop logic on Linux
        if: runner.os == 'Linux'
        run: cargo test --locked --release --manifest-path ui/Cargo.toml
      - name: Build Linux desktop
        if: runner.os == 'Linux'
        run: cargo build --locked --release --manifest-path ui/Cargo.toml
      - name: Package Linux desktop
        if: runner.os == 'Linux'
        run: python3 scripts/package-linux.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Save compiled dependencies even if tests fail
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  ci-success:
    name: CI success
    needs: [test, release-policy]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platforms to pass
        env:
          RESULT: ${{ needs.test.result }}
          POLICY_RESULT: ${{ needs.release-policy.result }}
        run: test "$RESULT" = success && test "$POLICY_RESULT" = success
